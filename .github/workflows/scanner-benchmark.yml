name: scanner-benchmark

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate benchmark corpus
        run: python benchmark/corpus/generate_corpus.py
      - name: Run benchmark runner
        run: python benchmark/runner.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: scanner-benchmark-report
          path: benchmark/reports/
