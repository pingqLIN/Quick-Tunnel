name: cleanup-branches-and-protect

on:
  push:
    paths:
      - ".github/workflows/cleanup-branches-and-protect.yml"

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Delete every remote branch except main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting branch: $branch"
            git push origin --delete "$branch"
          done

      - name: Remove this one-shot workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-branches-and-protect.yml
          git commit -m "Remove one-shot repository branch maintenance"
          git push origin HEAD:main

      - name: Protect main branch
        id: protect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/protection.json <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["windows", "macos", "python-3-14"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 0,
              "require_last_push_approval": false
            },
            "restrictions": null,
            "required_linear_history": false,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": true,
            "lock_branch": false,
            "allow_fork_syncing": true
          }
          JSON
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/branches/main/protection" \
            --input /tmp/protection.json

      - name: Report protection result
        shell: bash
        run: |
          if [[ "${{ steps.protect.outcome }}" == "success" ]]; then
            echo "Branch protection applied successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Branch cleanup succeeded, but GitHub Actions token could not apply repository-admin branch protection." >> "$GITHUB_STEP_SUMMARY"
          fi
