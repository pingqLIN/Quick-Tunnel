name: v6-production-port

on:
  push:
    branches:
      - production/v6-no-fsync
    paths:
      - ".github/workflows/v6-production-port.yml"

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: production/v6-no-fsync
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Apply minimal production port
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          mac = Path("macos/share-codex-review.py")
          text = mac.read_text(encoding="utf-8")
          old = "                    destination_file.flush()\n                    os.fsync(destination_file.fileno())"
          new = "                    # The review snapshot is ephemeral; flush Python buffers without forcing disk durability.\n                    destination_file.flush()"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one macOS durable-flush site, found {text.count(old)}")
          mac.write_text(text.replace(old, new), encoding="utf-8")

          win = Path("share-codex-review.ps1")
          text = win.read_text(encoding="utf-8")
          old = "        $destinationStream.Flush($true)"
          new = "        # The review snapshot is ephemeral; flush managed buffers without forcing disk durability.\n        $destinationStream.Flush()"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one Windows durable-flush site, found {text.count(old)}")
          win.write_text(text.replace(old, new), encoding="utf-8")

          shared_test = Path("tests/test_staging_flush_policy.py")
          shared_test.write_text('''from pathlib import Path\nimport unittest\n\n\nREPO_ROOT = Path(__file__).resolve().parents[1]\n\n\nclass StagingFlushPolicyTests(unittest.TestCase):\n    def test_macos_snapshot_does_not_force_per_file_fsync(self) -> None:\n        source = (REPO_ROOT / "macos" / "share-codex-review.py").read_text(encoding="utf-8")\n        self.assertNotIn("os.fsync(destination_file.fileno())", source)\n        self.assertIn("destination_file.flush()", source)\n\n    def test_windows_snapshot_does_not_force_durable_flush(self) -> None:\n        source = (REPO_ROOT / "share-codex-review.ps1").read_text(encoding="utf-8")\n        self.assertNotIn("$destinationStream.Flush($true)", source)\n        self.assertIn("$destinationStream.Flush()", source)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")

          mac_test = Path("macos/tests/test_v6_no_fsync.py")
          mac_test.write_text('''from __future__ import annotations\n\nimport importlib.util\nimport sys\nimport tempfile\nimport unittest\nfrom pathlib import Path\nfrom unittest import mock\n\n\nMODULE_PATH = Path(__file__).resolve().parents[1] / "share-codex-review.py"\nSPEC = importlib.util.spec_from_file_location("share_codex_review_v6_test", MODULE_PATH)\nif SPEC is None or SPEC.loader is None:\n    raise RuntimeError(f"Unable to load module: {MODULE_PATH}")\nMODULE = importlib.util.module_from_spec(SPEC)\nsys.modules[SPEC.name] = MODULE\nSPEC.loader.exec_module(MODULE)\n\n\nclass NoFsyncStagingTests(unittest.TestCase):\n    def test_copy_keeps_integrity_without_calling_fsync(self) -> None:\n        with tempfile.TemporaryDirectory() as temporary_directory:\n            root = Path(temporary_directory) / "source"\n            root.mkdir()\n            source = root / "review.txt"\n            payload = b"safe review payload\\n"\n            source.write_bytes(payload)\n            entry = MODULE.build_inventory(root, maximum_file_bytes=1024).files[0]\n            destination = Path(temporary_directory) / "stage" / "review.txt"\n\n            with mock.patch.object(MODULE.os, "fsync", side_effect=AssertionError("fsync must not be called")):\n                MODULE.copy_inventory_entry(entry, root, destination)\n\n            self.assertEqual(destination.read_bytes(), payload)\n            self.assertEqual(MODULE.hash_regular_file(destination, destination.name)[1], entry.content_hash)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY
      - name: Preflight regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile macos/share-codex-review.py macos/tests/test_v6_no_fsync.py tests/test_staging_flush_policy.py
          python -m unittest discover -s macos/tests -v
          python -m unittest discover -s tests -v
      - name: Commit clean production diff
        shell: bash
        run: |
          git rm .github/workflows/v6-production-port.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macos/share-codex-review.py share-codex-review.ps1 macos/tests/test_v6_no_fsync.py tests/test_staging_flush_policy.py
          git diff --cached --check
          git commit -m "Optimize ephemeral staging flush policy"
          git push origin HEAD:production/v6-no-fsync
