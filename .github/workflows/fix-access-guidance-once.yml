name: Fix Access guidance once

on:
  push:
    paths:
      - '.github/workflows/fix-access-guidance-once.yml'

permissions:
  contents: write

jobs:
  fix-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply reviewed Cloudflare Access corrections
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('README.md'): [
                  (
                      '| Managed Tunnel + Cloudflare Access | Active Cloudflare domain required for a public hostname | Cloudflare account, IdP, or email One-Time PIN | Cloudflare Access service token | Recommended protected mode |',
                      '| Managed Tunnel + Cloudflare Access | Active Cloudflare domain required for a public hostname | Cloudflare IdP for allowed account members, another IdP, or email One-Time PIN | Cloudflare Access service token with a matching `Service Auth` policy | Recommended protected mode |',
                  ),
                  (
                      'Access** in front of a self-hosted application. Access evaluates every request\nbefore forwarding it to the origin and supports identity-provider login and\nemail One-Time PIN. Automated reviewers can use Access **service tokens**\n(`CF-Access-Client-Id` and `CF-Access-Client-Secret`) instead of an interactive\nlogin.',
                      'Access** in front of a self-hosted application. Access evaluates every request\nbefore forwarding it to the origin. Human access can use a configured identity\nprovider — including Cloudflare as an IdP for allowed account members — or\nemail One-Time PIN. Automated reviewers can use Access **service tokens**\n(`CF-Access-Client-Id` and `CF-Access-Client-Secret`) without an interactive\nlogin, but the Access application must also include a **Service Auth** policy\nthat allows that service token.',
                  ),
              ],
              Path('README.zh-tw.md'): [
                  (
                      '| Managed Tunnel + Cloudflare Access | 公開 hostname 需要 Cloudflare 上的有效網域 | Cloudflare 帳號、IdP 或 Email One-Time PIN | Cloudflare Access service token | **建議的受保護模式** |',
                      '| Managed Tunnel + Cloudflare Access | 公開 hostname 需要 Cloudflare 上的有效網域 | Cloudflare IdP（限 Access policy 允許的帳號成員）、其他 IdP 或 Email One-Time PIN | Cloudflare Access service token，並搭配對應的 `Service Auth` policy | **建議的受保護模式** |',
                  ),
                  (
                      '保護 self-hosted application。Access 會在請求到達來源端之前先套用驗證政策，\n可使用身分供應商登入與 Email One-Time PIN。自動化審查器則可使用 Access\n**service token**（`CF-Access-Client-Id` 與 `CF-Access-Client-Secret`），避免互動式登入。',
                      '保護 self-hosted application。Access 會在請求到達來源端之前先套用驗證政策。\n人員可使用已設定的 IdP（包含將 Cloudflare 作為 IdP，並由 Access policy 限定\n可登入的帳號成員）或 Email One-Time PIN。自動化審查器可使用 Access\n**service token**（`CF-Access-Client-Id` 與 `CF-Access-Client-Secret`）避免互動式登入，\n但 Access application 必須另外建立允許該 token 的 **Service Auth** policy。',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old[:80]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit corrections and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-access-guidance-once.yml
          git add README.md README.zh-tw.md
          git commit -m 'docs: correct Cloudflare Access authentication guidance'
          git push origin HEAD:${GITHUB_REF_NAME}
