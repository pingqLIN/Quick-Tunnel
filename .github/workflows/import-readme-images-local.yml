name: Import locally staged README images

on:
  push:
    paths:
      - '.github/workflows/import-readme-images-local.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download locally verified image assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets/readme

          curl -L --fail --retry 3 -o docs/assets/readme/quick-tunnel-private-home-visit.jpg 'https://at.adobe.com/pU9kw2JV711vW6iK'
          curl -L --fail --retry 3 -o docs/assets/readme/quick-tunnel-outdoor-tunnel-gate.jpg 'https://at.adobe.com/F7y38VmeKyfu2tPh'

          cat > /tmp/expected.sha256 <<'EOF'
          1a28a5198380a2979ccb9315e022530ac9c1421352bec0e75958375454f926ca  docs/assets/readme/quick-tunnel-private-home-visit.jpg
          0ece726f6de8ec34f4fd24ffa3d5fecd5dc97231a3fd8bb89c5394c48405e97e  docs/assets/readme/quick-tunnel-outdoor-tunnel-gate.jpg
          EOF
          sed -i 's/^          //' /tmp/expected.sha256
          sha256sum -c /tmp/expected.sha256

      - name: Commit image assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/readme/quick-tunnel-private-home-visit.jpg \
                  docs/assets/readme/quick-tunnel-outdoor-tunnel-gate.jpg
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'docs: replace README mascot scenes from local staging'
          git push origin HEAD:${GITHUB_REF_NAME}
