name: Clean README Cloudflare guidance once

on:
  push:
    paths:
      - '.github/workflows/clean-readme-cloudflare-once.yml'

permissions:
  contents: write

jobs:
  clean-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Rewrite README sections as user-facing documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'README.md': {
                  'toc_old': '- [Authenticated Sharing Evaluation](#authenticated-sharing-evaluation)',
                  'toc_new': '- [Protected Access](#protected-access)',
                  'req_old': "There is no invented numeric `cloudflared` minimum: Cloudflare publishes a\none-year release-support policy, while this project enforces only the CLI\ncapabilities it uses. Keep `cloudflared` updated within that support window.\nThe Finder path additionally requires built-in zsh, Terminal, Finder,\nAutomator, AppleScript, and `plutil`.",
                  'req_new': "`cloudflared` must be available on `PATH`. Keep it updated to a release that is\nstill supported by Cloudflare. The Finder path additionally requires built-in\nzsh, Terminal, Finder, Automator, AppleScript, and `plutil`.",
                  'start': '## Authenticated Sharing Evaluation',
                  'end': '\n---\n\n## Before You Share',
                  'section': '''## Protected Access\n\nThe Quick Tunnel mode used by this project is **unauthenticated** and does not\nprovide a shared-password option. Anyone who has the temporary URL can reach\nthe published snapshot while the tunnel is active.\n\nFor access-controlled sharing, use a **managed Cloudflare Tunnel + Cloudflare\nAccess**. A public hostname requires a domain managed in Cloudflare. Human users\ncan authenticate through a configured identity provider or Email One-Time PIN.\nAutomated reviewers can use Cloudflare Access **service tokens**\n(`CF-Access-Client-Id` and `CF-Access-Client-Secret`); the Access application\nmust include a matching **Service Auth** policy that allows the token.\n\n| Mode | Authentication | Requirements | Use |\n| --- | --- | --- | --- |\n| Quick Tunnel | None | `cloudflared` | Short-lived, low-sensitivity review |\n| Managed Tunnel + Cloudflare Access | IdP / Email One-Time PIN for people; service token for machines | Cloudflare-managed domain, managed Tunnel, Access application and policies | Access-controlled review |\n\nOfficial references:\n\n- [Publish a self-hosted application with Cloudflare Access](https://developers.cloudflare.com/cloudflare-one/access-controls/applications/http-apps/self-hosted-public-app/)\n- [One-Time PIN login](https://developers.cloudflare.com/cloudflare-one/integrations/identity-providers/one-time-pin/)\n- [Service tokens](https://developers.cloudflare.com/cloudflare-one/access-controls/service-credentials/service-tokens/)\n- [Authenticate coding agents](https://developers.cloudflare.com/cloudflare-one/access-controls/authenticate-agents/)\n\nA local shared-password gate is not part of the supported runtime documented by\nthis repository.\n'''
              },
              'README.zh-tw.md': {
                  'toc_old': '- [具身分驗證的分享模式評估](#具身分驗證的分享模式評估)',
                  'toc_new': '- [受保護存取](#受保護存取)',
                  'req_old': "本專案不會虛構固定的 `cloudflared` 最低版本。Cloudflare 公布的版本支援期為\n一年；程式只強制檢查實際使用的 CLI 能力。請讓 `cloudflared` 保持在支援\n期限內。Finder 路徑另外需要系統內建的 zsh、Terminal、Finder、Automator、\nAppleScript 與 `plutil`。",
                  'req_new': "`cloudflared` 必須可由 `PATH` 直接呼叫，並應維持在 Cloudflare 仍支援的版本。\nFinder 路徑另外需要系統內建的 zsh、Terminal、Finder、Automator、AppleScript\n與 `plutil`。",
                  'start': '## 具身分驗證的分享模式評估',
                  'end': '\n---\n\n## 分享前注意事項',
                  'section': '''## 受保護存取\n\n本專案使用的 Quick Tunnel 模式**不含身分驗證**，也沒有提供共用密碼選項。\n通道有效期間，任何取得暫時網址的人都能存取已發布的快照。\n\n若需要存取控制，請使用 **Managed Cloudflare Tunnel + Cloudflare Access**。\n公開 hostname 需要由 Cloudflare 管理的網域。人員可透過已設定的身分供應商\n（IdP）或 Email One-Time PIN 驗證；自動化審查器可使用 Cloudflare Access\n**service token**（`CF-Access-Client-Id` 與 `CF-Access-Client-Secret`），且 Access\napplication 必須建立允許該 token 的 **Service Auth** policy。\n\n| 模式 | 驗證方式 | 所需條件 | 適用情境 |\n| --- | --- | --- | --- |\n| Quick Tunnel | 無 | `cloudflared` | 短時、低敏感度審查 |\n| Managed Tunnel + Cloudflare Access | 人員使用 IdP／Email One-Time PIN；機器使用 service token | Cloudflare 管理的網域、Managed Tunnel、Access application 與 policy | 需要存取控制的審查 |\n\nCloudflare 官方資料：\n\n- [使用 Cloudflare Access 發布 self-hosted application](https://developers.cloudflare.com/cloudflare-one/access-controls/applications/http-apps/self-hosted-public-app/)\n- [One-Time PIN 登入](https://developers.cloudflare.com/cloudflare-one/integrations/identity-providers/one-time-pin/)\n- [Service tokens](https://developers.cloudflare.com/cloudflare-one/access-controls/service-credentials/service-tokens/)\n- [Coding Agent 驗證](https://developers.cloudflare.com/cloudflare-one/access-controls/authenticate-agents/)\n\n本 repository 的支援功能不包含本機共用密碼閘門。\n'''
              }
          }

          for name, cfg in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old in (cfg['toc_old'], cfg['req_old'], cfg['start'], cfg['end']):
                  if old not in text:
                      raise SystemExit(f'{name}: expected text not found: {old[:60]!r}')
              text = text.replace(cfg['toc_old'], cfg['toc_new'])
              text = text.replace(cfg['req_old'], cfg['req_new'])
              start = text.index(cfg['start'])
              end = text.index(cfg['end'], start)
              text = text[:start] + cfg['section'] + text[end:]
              path.write_text(text)
          PY

          if grep -nEi 'Authenticated Sharing Evaluation|具身分驗證的分享模式評估|Implementation recommendation|實作建議|future explicit authentication|若實作可|Possible compatibility mode|invented numeric|不會虛構固定' README.md README.zh-tw.md; then
            echo 'README still contains development/evaluation language.' >&2
            exit 1
          fi

      - name: Commit cleaned documentation and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/clean-readme-cloudflare-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-tw.md .github/workflows/clean-readme-cloudflare-once.yml
          git commit -m 'docs: keep README user-facing and definitive'
          git push origin HEAD:${GITHUB_REF_NAME}
