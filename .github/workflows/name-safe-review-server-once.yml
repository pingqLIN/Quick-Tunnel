name: Name safe review server once

on:
  push:
    paths:
      - '.github/workflows/name-safe-review-server-once.yml'

permissions:
  contents: write

jobs:
  fix-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Make Password ownership explicit
        shell: python
        run: |
          from pathlib import Path

          edits = {
              Path('README.md'): (
                  '`Password` should be enforced by the local safe server without',
                  '`Password` should be enforced by `safe-review-server.py` without',
              ),
              Path('README.zh-tw.md'): (
                  '`Quick`、`Password`、`Access`。`Password` 應由本機 safe server 執行，而且密碼',
                  '`Quick`、`Password`、`Access`。`Password` 應由 `safe-review-server.py` 執行，而且密碼',
              ),
          }

          for path, (old, new) in edits.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

      - name: Commit correction and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/name-safe-review-server-once.yml
          git add README.md README.zh-tw.md
          git commit -m 'docs: name password-gate responsibility explicitly'
          git push origin HEAD:${GITHUB_REF_NAME}
